name: Release

# A release: universal CloudMachine.app (Apple Silicon + Intel) signed with a
# STABLE certificate, a .dmg in the GitHub Release and an updated cask in
# RenaCode/homebrew-tap (`brew install --cask renacode/tap/cloudmachine`).
#
# Continuous delivery: every merge to main that changes what goes into the
# app (sources, resources, launchd templates, the cask) is released, tagged
# on that commit. Docs-only and test-only merges are not.
#
# Version: mac-app/VERSION is the base. If v<VERSION> is not tagged yet, that
# is the release; otherwise the patch number goes up from the highest tag of
# that major.minor (1.3.0 -> 1.3.1 -> 1.3.2). Bump VERSION by hand only for a
# minor or major release. The computed number is written into the build, so
# the app reports the version it was released as.
#
# Also: "Run workflow" on the Actions tab (same as a merge), and a vX.Y.Z tag
# pushed by hand, which releases exactly that version.
#
# A pull request that changes the build or the cask goes through the same
# pipeline as a dry run: ad-hoc signature, no release and no tap, artifacts
# downloadable from the run.
#
# Secrets (publishing runs only):
#   CM_SIGNING_P12_BASE64, CM_SIGNING_P12_PASSWORD - the self-signed
#     "CloudMachine Release Signing" certificate (see packaging/README.md).
#     Without it the release does NOT build: an ad-hoc signature changes the
#     app's identity on every release and macOS revokes Full Disk Access after
#     every upgrade.
#   HOMEBREW_TAP_TOKEN - token with write access to RenaCode/homebrew-tap.
#
# Still no Developer ID and no notarization - Gatekeeper does not know the
# publisher; the cask removes the quarantine attribute in postflight.

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
    paths:
      - "mac-app/VERSION"
      - "mac-app/Package.swift"
      - "mac-app/Package.resolved"
      - "mac-app/Sources/**"
      - "mac-app/Resources/**"
      - "launchd/**"
      - "config/**"
      - "packaging/homebrew/**"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "mac-app/Sources/CloudMachineAgent/BuildAppCommand.swift"
      - "mac-app/Sources/CloudMachineAgent/MakeDmgCommand.swift"
      - "mac-app/Resources/Info.plist"

env:
  CM_SIGNING_CERT_NAME: CloudMachine Release Signing

# One release at a time: a VERSION merge and a hand-pushed tag for the same
# version must not race each other to publish it twice.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  # Decides on a cheap Linux runner whether this run publishes, so a VERSION
  # change that is already released costs no macOS minutes.
  decide:
    name: Decide
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      skip: ${{ steps.decide.outputs.skip }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        run: |
          base="$(tr -d '[:space:]' < mac-app/VERSION)"
          release=false
          skip=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            version="$base"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            release=true
          elif git ls-remote --exit-code --tags origin "refs/tags/v${base}" >/dev/null; then
            # Base already released: next patch after the highest tag of
            # this major.minor. Sorted as versions, not strings (1.3.10 > 1.3.9).
            minor="${base%.*}"
            last="$(git ls-remote --tags --refs origin "refs/tags/v${minor}.*" \
              | sed 's|.*refs/tags/v||' | grep -E "^${minor//./\\.}\.[0-9]+$" | sort -V | tail -1)"
            version="${minor}.$(( ${last##*.} + 1 ))"
            release=true
          else
            version="$base"
            release=true
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${version}' is not a version (X.Y.Z)."
            exit 1
          fi
          if [ "$release" = "true" ] && [[ "$GITHUB_REF" != refs/tags/* ]] \
            && git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "::notice::v${version} already exists - nothing to release."
            skip=true
          fi
          echo "Version: ${version} (release=${release})"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

  release:
    name: Build, release, update tap
    needs: decide
    if: needs.decide.outputs.skip != 'true'
    runs-on: macos-15
    permissions:
      contents: write
    env:
      IS_RELEASE: ${{ needs.decide.outputs.release }}
      VERSION: ${{ needs.decide.outputs.version }}
      # Read by build-app and make-dmg; the computed version must not be
      # written into mac-app/VERSION, which would mark every release dirty.
      CM_RELEASE_VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: swift test
        working-directory: mac-app
        run: swift test

      - name: Import signing certificate
        if: env.IS_RELEASE == 'true'
        env:
          P12_BASE64: ${{ secrets.CM_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.CM_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::CM_SIGNING_P12_* secrets are missing. An ad-hoc signed release would revoke Full Disk Access after every upgrade - aborting. See packaging/README.md."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -nokeys \
            -passin "pass:$P12_PASSWORD" -out "$RUNNER_TEMP/cert.pem"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          # Add it to the search list, because `build-app` looks for the
          # certificate with `security find-certificate -c` without naming a keychain.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          rm -f "$RUNNER_TEMP/cert.p12"

      # Shown before the build: v1.3.0 shipped marked DIRTY-TREE, and the log
      # did not say which file a runner step had changed.
      - name: Working tree state
        run: git status --porcelain && git diff --stat

      - name: Build CloudMachine.app (universal)
        working-directory: mac-app
        run: |
          # Commit count as the build number, computed here so a failing git
          # call inside build-app cannot quietly turn it into a date (v1.3.1).
          CM_BUILD_NUMBER="$(git rev-list --count HEAD)"
          if [ -z "$CM_BUILD_NUMBER" ]; then
            echo "::error::git rev-list --count HEAD returned nothing."; exit 1
          fi
          export CM_BUILD_NUMBER
          swift run cloudmachine-agent build-app --universal

      - name: Verify architectures and signature
        working-directory: mac-app
        run: |
          for bin in CloudMachine cloudmachine-agent; do
            archs="$(lipo -archs "build/CloudMachine.app/Contents/MacOS/$bin")"
            echo "$bin: $archs"
            case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *)
              echo "::error::$bin is not universal ($archs)"; exit 1 ;;
            esac
          done
          codesign --verify --deep --strict build/CloudMachine.app
          signature="$(codesign -dv --verbose=2 build/CloudMachine.app 2>&1)"
          echo "$signature"
          # `build-app` silently falls back to ad-hoc when it cannot find the
          # certificate - here that has to be an error, not a warning.
          if [ "$IS_RELEASE" = "true" ] && ! grep -qF "Authority=$CM_SIGNING_CERT_NAME" <<<"$signature"; then
            echo "::error::The release is not signed with the '$CM_SIGNING_CERT_NAME' certificate."
            exit 1
          fi

      # `hdiutil create` on GitHub's macOS runners fails now and then with
      # "Resource busy" - it did on the first v1.3.0 run, after passing three
      # dry runs. Retried with a growing pause; a real failure still fails.
      # A release must be exactly a commit. v1.3.0 was not: the macos-14
      # runner (Swift 5.10) could not use swift-argument-parser 1.8.2, which
      # needs Swift 6, quietly resolved 1.7.2 and rewrote Package.resolved.
      # Any tracked file changed by the build stops the release here.
      - name: Build did not change tracked files
        if: env.IS_RELEASE == 'true'
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git status --porcelain --untracked-files=no
            git diff
            echo "::error::The build changed tracked files; the release would not match its commit."
            exit 1
          fi

      - name: Package .dmg
        working-directory: mac-app
        run: |
          for attempt in 1 2 3 4 5; do
            swift run cloudmachine-agent make-dmg && exit 0
            echo "::warning::make-dmg attempt ${attempt} failed; retrying"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Render cask
        id: cask
        run: |
          version="${{ env.VERSION }}"
          dmg="mac-app/build/CloudMachine-${version}.dmg"
          sha256="$(shasum -a 256 "$dmg" | cut -d' ' -f1)"
          sed -e "s/__VERSION__/${version}/" -e "s/__SHA256__/${sha256}/" \
            packaging/homebrew/cloudmachine.rb.in > mac-app/build/cloudmachine.rb
          if grep -q '__[A-Z0-9]*__' mac-app/build/cloudmachine.rb; then
            echo "::error::An unfilled placeholder is left in the cask."; exit 1
          fi
          echo "${sha256}  CloudMachine-${version}.dmg" > "mac-app/build/CloudMachine-${version}.dmg.sha256"
          echo "dmg=${dmg}" >> "$GITHUB_OUTPUT"

      # `brew style` applies the cask rules only to files in a tap's Casks/ -
      # on a loose file it checks it as plain Ruby and lets cask errors through.
      - name: brew style + audit
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew tap-new --no-git renacode/ci-check
          tap="$(brew --repository renacode/ci-check)"
          mkdir -p "$tap/Casks"
          cp mac-app/build/cloudmachine.rb "$tap/Casks/cloudmachine.rb"
          brew style --cask renacode/ci-check/cloudmachine
          brew audit --cask --strict renacode/ci-check/cloudmachine

      - name: Upload artifacts (dry run)
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cloudmachine-${{ env.VERSION }}-dry-run
          path: |
            mac-app/build/*.dmg
            mac-app/build/*.sha256
            mac-app/build/cloudmachine.rb

      - name: Publish GitHub Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag on this commit when the run did not start from one.
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            mac-app/build/*.dmg
            mac-app/build/*.sha256
          generate_release_notes: true

      - name: Check tap token
        if: env.IS_RELEASE == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::Release published, but HOMEBREW_TAP_TOKEN is missing - the cask in the tap was NOT updated. Contents to insert manually:"
            cat mac-app/build/cloudmachine.rb
            exit 1
          fi

      - name: Check out tap
        if: env.IS_RELEASE == 'true'
        uses: actions/checkout@v4
        with:
          repository: RenaCode/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Push cask to tap
        if: env.IS_RELEASE == 'true'
        working-directory: homebrew-tap
        run: |
          mkdir -p Casks
          cp ../mac-app/build/cloudmachine.rb Casks/cloudmachine.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/cloudmachine.rb
          if git diff --cached --quiet; then
            echo "Cask unchanged."; exit 0
          fi
          git commit -m "cloudmachine ${{ env.VERSION }}"
          git push
