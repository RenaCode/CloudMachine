name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # release.yml publishes only from main or a tag on main
  # (see the script's header).
  release-workflow:
    name: Release workflow guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: test-release-workflow
        run: bash .github/test-release-workflow.sh

  build-app:
    name: Build Swift package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install swift-format
        run: brew install swift-format
      # The Homebrew binary by name, not `swift format`: on macos-15 the latter
      # runs the older swift-format bundled with Xcode 16, whose rules differ
      # (it flagged code the current release accepts).
      - name: swift-format lint
        working-directory: mac-app
        run: swift-format lint --strict --recursive Sources Tests
      - name: swift build
        working-directory: mac-app
        run: swift build
      - name: swift test
        working-directory: mac-app
        run: swift test
