# CloudMachine: Samba serves the share only on top of the Drive layers, and
# never before the rclone configuration has been copied in.
[Unit]
Requires=rclone-tm.service punchfs.service tm-bands-bind.service
After=rclone-tm.service punchfs.service tm-bands-bind.service
ConditionPathExists=/etc/rclone/rclone.conf
