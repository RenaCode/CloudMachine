# CloudMachine: the Linux machine that serves Time Machine over SMB and keeps
# the backup on Google Drive. Created by `cloudmachine-agent vm-setup`
# (`limactl create --name cmsmb vm/cmsmb.yaml`); see vm/README.md.
#
# Every provisioning step below runs again on every boot, so each one checks
# before it acts. The `data` files are rewritten on every boot (Lima's
# default), which is how a changed template reaches an existing machine.
# Files are read relative to this template when the machine is created.
vmType: vz
arch: aarch64
cpus: 2
memory: 2GiB
# The disk is also rclone's upload buffer (--vfs-cache-max-size 120G).
disk: 200GiB
images:
- location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: aarch64
# Nothing from the Mac is shared into the machine.
mounts: []
networks:
# vzNAT gives the machine an address the Mac can reach (192.168.64.x); SMB to
# the Mac's own address is refused by NetFS.
- vzNAT: true
containerd:
  system: false
  user: false
provision:
- mode: data
  path: /etc/samba/smb.conf
  file: samba/smb.conf
- mode: data
  path: /etc/fuse.conf
  file: fuse.conf
- mode: data
  path: /etc/systemd/system/rclone-tm.service
  file: systemd/rclone-tm.service
- mode: data
  path: /etc/systemd/system/punchfs.service
  file: systemd/punchfs.service
- mode: data
  path: /etc/systemd/system/tm-bands-bind.service
  file: systemd/tm-bands-bind.service
- mode: data
  path: /etc/systemd/system/smbd.service.d/cloudmachine.conf
  file: systemd/smbd.service.d/cloudmachine.conf
- mode: data
  path: /etc/systemd/system/smbd.service.d/limits.conf
  file: systemd/smbd.service.d/limits.conf
- mode: data
  path: /opt/cloudmachine/punchfs/punchfs.c
  file: punchfs/punchfs.c
- mode: data
  path: /opt/cloudmachine/punchfs/test-punchfs.sh
  file: punchfs/test-punchfs.sh
  permissions: 755
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive

    # 1. Packages.
    PACKAGES="samba fuse3 unzip curl libfuse3-dev pkg-config build-essential attr"
    if ! dpkg -s $PACKAGES >/dev/null 2>&1; then
      apt-get update
      apt-get install -y $PACKAGES
    fi

    # 2. rclone, pinned. Ubuntu's package is years behind; the release zip is
    #    checked against the sum published in
    #    https://downloads.rclone.org/v1.75.1/SHA256SUMS before it is installed.
    RCLONE_VERSION=v1.75.1
    RCLONE_SHA256=03f2504174034b6d004152ed7369251c9a9ec1f7e0836eda420f5c7a5ec0dff9
    if [ "$(/usr/local/bin/rclone version 2>/dev/null | head -1)" != "rclone $RCLONE_VERSION" ]; then
      tmp=$(mktemp -d)
      zip="rclone-$RCLONE_VERSION-linux-arm64"
      curl -fsSL -o "$tmp/$zip.zip" "https://downloads.rclone.org/$RCLONE_VERSION/$zip.zip"
      echo "$RCLONE_SHA256  $tmp/$zip.zip" | sha256sum -c -
      unzip -q "$tmp/$zip.zip" -d "$tmp"
      install -m 755 "$tmp/$zip/rclone" /usr/local/bin/rclone
      rm -rf "$tmp"
    fi

    # 3. The SMB user. Its password is set by `cloudmachine-agent vm-setup`.
    id tm >/dev/null 2>&1 || useradd -M -s /usr/sbin/nologin tm

    # 4. Directories.
    mkdir -p /srv/tm /srv/tm-local /srv/tm-punch /srv/tm-xattr \
      /etc/rclone /etc/cloudmachine /var/cache/rclone /var/lib/cloudmachine
    chmod 700 /srv/tm-xattr /etc/rclone /var/lib/cloudmachine
    chown tm:tm /srv/tm-local
    printf 'TM_UID=%s\nTM_GID=%s\n' "$(id -u tm)" "$(id -g tm)" > /etc/cloudmachine/tm-ids.env

    # 5. punchfs, rebuilt only when its source changed.
    src=/opt/cloudmachine/punchfs/punchfs.c
    built=/var/lib/cloudmachine/punchfs.built.c
    if [ ! -x /usr/local/bin/punchfs ] || ! cmp -s "$src" "$built"; then
      gcc -Wall -O2 -D_FILE_OFFSET_BITS=64 -DHAVE_FALLOCATE "$src" \
        $(pkg-config fuse3 --cflags --libs) -o /usr/local/bin/punchfs.new
      mv /usr/local/bin/punchfs.new /usr/local/bin/punchfs
      cp "$src" "$built"
      # A running punchfs keeps the old binary until it restarts.
      if systemctl is-active --quiet punchfs; then echo "punchfs rebuilt: restart it when idle"; fi
    fi

    # 6. Services. They wait for /etc/rclone/rclone.conf (ConditionPathExists),
    #    which `vm-setup` copies in, and the bands bind waits for
    #    /etc/cloudmachine/bundle.env, which `vm-prepare-bundle` writes.
    systemctl daemon-reload
    systemctl enable rclone-tm.service punchfs.service tm-bands-bind.service smbd.service
    if [ -s /etc/rclone/rclone.conf ] && [ -s /etc/cloudmachine/vm.env ]; then
      systemctl start rclone-tm.service punchfs.service tm-bands-bind.service smbd.service
    fi
