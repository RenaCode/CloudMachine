# CloudMachine: unattended-upgrades must not restart the backup stack.
#
# 13 Nov 2026 06:10 a libc update made needrestart restart punchfs and Samba
# in the middle of a Time Machine backup; the bands bind then raced punchfs,
# failed, and Samba stayed down for a day. These units are restarted only by
# CloudMachine (`cloudmachine-agent vm-update`) or at the next boot of the
# machine, which picks up the updated libraries.
$nrconf{override_rc}->{qr(^(rclone-tm|punchfs|tm-bands-bind|smbd|nmbd|smb-throttle|tm-meta-sync)\.service$)} = 0;
